<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aegis · Research workspace</title><link rel="stylesheet" href="/workspace.css"><script defer src="/workspace.js"></script>
<header><strong><span class="mark">A</span> Aegis AI</strong><span>Document intelligence</span></header>
<main><h1>Research workspace</h1><form id="connect"><label for="key">Workspace access key</label><div class="row"><input id="key" type="password" autocomplete="off" required placeholder="Enter the key from your .env file"><button>Unlock workspace</button></div></form>
<div id="workspace" hidden><button id="lock" class="secondary">Lock workspace</button><div class="grid"><aside><h2>Source library</h2><form id="upload"><label for="pdf">Add a text PDF · up to 4 MiB</label><input id="pdf" type="file" accept="application/pdf,.pdf" required><button>Upload PDF</button></form><h3>Selected sources</h3><div id="sources"></div></aside>
<section><h2>Ask your documents</h2><form id="ask"><label for="question">Research question</label><textarea id="question" required maxlength="1000" placeholder="What do the selected documents say?"></textarea><button>Find evidence &rarr;</button></form><article id="result" aria-live="polite"></article></section></div></div><p role="status" id="status"></p></main></html>
